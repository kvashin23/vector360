<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вектор 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F0;--paper:#fff;--ink:#22302B;--soft:#5A6863;--line:#D3DAD7;--dark:#2F3B36;--accent:#6E8B74;--accent-ink:#fff;--hl:#C9A45C;--r:18px;
  --display:"Manrope","Segoe UI",Arial,sans-serif;--text:"Golos Text","Segoe UI",Arial,sans-serif}
body[data-theme="karluu"]{--bg:#E7EAF0;--ink:#16233F;--soft:#55607A;--line:#CCD2DE;--dark:#1F3466;--accent:#1F3466;--hl:#8EA0C2}
body[data-theme="rizalta"]{--bg:#F7F1E6;--ink:#253622;--soft:#5D6550;--line:#E2D7C3;--dark:#28391F;--accent:#A57C2E;--hl:#C79A3C}
body[data-theme="mariupol"]{--bg:#EEF3F6;--ink:#1B2C3A;--soft:#526472;--line:#CFDBE3;--dark:#1E4A66;--accent:#E0A526;--accent-ink:#1B2C3A;--hl:#E0A526}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--text)}
img,svg{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.12;letter-spacing:-.01em}
h2{font-size:clamp(28px,3.4vw,44px);font-weight:600}
h3{font-size:19px;font-weight:600}
p{margin:0}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.section{padding:88px 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.head p{max-width:520px;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px;font:600 16px/1.2 var(--text);padding:16px 26px;border-radius:999px;border:0;cursor:pointer;text-decoration:none}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-main:hover{filter:brightness(1.08)}
.btn-line{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.fish{display:inline-block;font:500 12px/1.4 var(--text);background:#FFF3D1;color:#7A5410;border-radius:4px;padding:1px 7px;vertical-align:middle;margin-left:6px}
.proto{background:#FFF3D1;color:#5E4310;font-size:14px;text-align:center;padding:8px 16px}
.proto a{margin:0 6px;font-weight:600}
.proto a[aria-current="page"]{text-decoration:none;border-bottom:2px solid currentColor}

/* header */
.header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.header .wrap{display:flex;align-items:center;gap:28px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;white-space:nowrap}
.brand{color:var(--ink);--logo-gold:#AE9468}
.logo{display:block;height:30px;width:auto;aspect-ratio:536.7/102.3}
footer .logo{height:28px;color:#fff;--logo-gold:#D6C4A8}
.nav{display:flex;gap:22px;margin-left:auto}
.nav a{text-decoration:none;font-size:15px;color:var(--soft);white-space:nowrap}
.nav a:hover{color:var(--ink)}
.phone{font-weight:600;text-decoration:none;white-space:nowrap}
.header .btn{padding:11px 18px;font-size:14px;white-space:nowrap}
@media (max-width:1100px){.nav{display:none}.phone{margin-left:auto}}
@media (max-width:640px){.phone{display:none}.header .btn{margin-left:auto}.brand .logo{height:24px}}

/* hero */
.hero{position:relative;color:#fff;background:var(--dark);overflow:hidden}
.hero-media{position:absolute;inset:0}
.hero-media img,.hero-media svg{width:100%;height:100%;object-fit:cover}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,20,18,.82) 0%,rgba(15,20,18,.55) 48%,rgba(15,20,18,.1) 100%)}
.hero .wrap{position:relative;min-height:640px;display:flex;flex-direction:column;justify-content:center;padding-top:64px;padding-bottom:64px}
.eyebrow{font-size:15px;opacity:.9;margin-bottom:16px}
.hero h1{font-size:clamp(40px,6vw,84px);font-weight:300;letter-spacing:-.02em;max-width:820px}
.hero .lede{font-size:19px;max-width:600px;margin-top:20px;opacity:.95}
.hero .price{margin-top:28px;font:600 clamp(24px,2.6vw,32px)/1.2 var(--display)}
.hero .price span{display:block;font:400 14px/1.4 var(--text);opacity:.8;margin-bottom:4px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:48px;max-width:860px;border-top:1px solid rgba(255,255,255,.35)}
.kpis div{padding:18px 24px 0 0}
.kpis strong{display:block;font:600 clamp(26px,3vw,38px)/1.1 var(--display)}
.kpis span{font-size:14px;opacity:.85}
.src-note{font-size:12px;opacity:.7;margin-top:14px}
@media (max-width:700px){.kpis{grid-template-columns:1fr}.hero .wrap{min-height:0}}

/* generic cards */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
@media (max-width:900px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:28px}
.card h3{margin-bottom:10px}
.card p{color:var(--soft);font-size:16px}
.who{border-top:2px solid var(--accent);padding-top:18px}
.who p{font:400 20px/1.35 var(--display)}

/* invest */
.calc-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.calc-card .top{background:var(--dark);color:#fff;padding:26px 28px}
.calc-card .top span{font-size:14px;opacity:.85}
.calc-card .top strong{display:block;font:600 34px/1.1 var(--display);margin-top:6px}
.calc-card .top em{display:block;font-style:normal;font-size:14px;opacity:.8;margin-top:6px}
.rows{padding:8px 28px 24px}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.rows div:last-child{border-bottom:0}
.rows span{color:var(--soft)}
.rows b{text-align:right}
.rows .big b{font:700 22px/1.2 var(--display);color:var(--accent)}
body[data-theme="kedry"] .rows .big b{color:var(--dark)}
.disc{font-size:13px;color:var(--soft);margin-top:18px;max-width:900px}
.bars{display:flex;align-items:flex-end;gap:12px;height:240px;margin-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:13px;text-align:center}
.bar i{display:block;width:100%;background:var(--hl);border-radius:6px 6px 0 0}
.bar.last i{background:var(--accent)}
.bar b{font-size:13px}
.table-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{text-align:left;padding:16px 20px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--soft);font-size:14px}
tr:last-child td{border-bottom:0}

/* terms */
.terms{background:var(--dark);color:#fff;border-radius:var(--r);padding:36px 40px;display:flex;justify-content:space-between;align-items:center;gap:28px;flex-wrap:wrap}
.terms h2{font-size:clamp(24px,2.6vw,34px);margin-bottom:10px}
.terms p{opacity:.9;max-width:640px}
.offer{margin-top:22px;border:2px solid var(--hl);border-radius:var(--r);padding:26px 30px;display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap;background:var(--paper)}
.offer .tag{display:inline-block;background:var(--hl);color:#1d1d1d;font-weight:600;font-size:13px;padding:5px 12px;border-radius:999px;margin-bottom:10px}
.offer p{color:var(--soft)}

/* mortgage */
.dark-sec{background:var(--dark);color:#fff}
.dark-sec .head p{color:rgba(255,255,255,.75)}
.facts4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.3);margin-bottom:40px}
.facts4 div{padding:16px 16px 0 0}
.facts4 span{font-size:14px;opacity:.75}
.facts4 strong{display:block;font:600 22px/1.25 var(--display)}
@media (max-width:800px){.facts4{grid-template-columns:1fr 1fr}}
.mcalc{display:grid;grid-template-columns:1fr 1fr;gap:40px}
@media (max-width:860px){.mcalc{grid-template-columns:1fr}}
.field{margin-bottom:26px}
.field>span{display:block;font-size:14px;opacity:.75;margin-bottom:6px}
.field .val{font-weight:600;margin-bottom:6px}
input[type=range]{width:100%;accent-color:var(--hl)}
.mout{background:rgba(255,255,255,.07);border-radius:var(--r);padding:30px;display:flex;flex-direction:column;gap:18px}
.mout .big{font:700 clamp(34px,4vw,50px)/1.1 var(--display);color:var(--hl)}
.mout .row{display:flex;justify-content:space-between;gap:16px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.12)}
.mout .row span:first-child{opacity:.75}
.mout .disc{color:rgba(255,255,255,.65);margin:0}
.vs{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.vs div{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:26px}
.vs span{color:var(--soft)}
.vs strong{display:block;font:700 clamp(26px,3vw,36px)/1.15 var(--display);margin:6px 0}
.vs em{font-style:normal;color:var(--soft);font-size:15px}
.vs .main{background:var(--hl);border-color:var(--hl)}
.vs .main span,.vs .main em{color:var(--ink)}
@media (max-width:860px){.vs{grid-template-columns:1fr}}
.shots{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:22px}
.shots figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.shots img{width:100%}
.shots figcaption{font-size:13px;color:var(--soft);padding:10px 12px}
@media (max-width:900px){.shots{grid-template-columns:1fr 1fr}}

/* location */
.loc{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.loc img{border-radius:var(--r);width:100%;max-height:600px;object-fit:cover;object-position:top}
.loc ul{list-style:none;margin:0;padding:0}
#finish li{padding:12px 0;border-bottom:1px solid var(--line)}
.loc li{display:flex;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.loc li span{color:var(--soft)}
.loc li b{text-align:right}
@media (max-width:860px){.loc{grid-template-columns:1fr}}
.pic-wide{border-radius:var(--r);overflow:hidden}
.pic-wide img{width:100%;max-height:520px;object-fit:cover}

/* video */
.vplayer{display:block;width:100%;aspect-ratio:16/9;border-radius:var(--r);background:#000}
.hero .price .pnote{display:block;font:400 14px/1.4 var(--text);opacity:.8;margin-top:6px;max-width:460px}
.facts4.light{border-top-color:var(--ink);margin-bottom:28px}
.facts4.light span{color:var(--soft);opacity:1}
.video{position:relative;display:block;width:100%;aspect-ratio:16/7;border:0;padding:0;border-radius:var(--r);overflow:hidden;cursor:pointer;background:var(--dark)}
.video img,.video svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.6}
.video .play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:var(--hl)}
.video .play::after{content:"";position:absolute;left:33px;top:26px;border-left:24px solid #1d1d1d;border-top:16px solid transparent;border-bottom:16px solid transparent}
.video .cap{position:absolute;left:24px;bottom:20px;color:#fff;font-weight:500}
.vvert{display:block;width:100%;aspect-ratio:9/16;border-radius:var(--r);background:#000;object-fit:cover}
.promo{display:grid;grid-template-columns:340px 1fr;gap:56px;align-items:center}
.promo .ptext{font:400 21px/1.45 var(--display);margin-bottom:16px}
@media (max-width:860px){.promo{grid-template-columns:1fr;gap:28px}.promo .vvert{max-width:320px;margin:0 auto}}
.clist{margin:18px 0 0;padding:0;list-style:none}
.clist li{padding:12px 0;border-bottom:1px solid var(--line)}

/* hero story video */
.story{position:absolute;right:24px;top:50%;transform:translateY(-50%);width:270px;aspect-ratio:9/16;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.45);background:#000}
.story video{width:100%;height:100%;object-fit:cover;display:block}
.snd{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;font:600 13px/1 var(--text);padding:9px 14px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#1d1d1d;cursor:pointer}
.has-story h1,.has-story .lede,.has-story .kpis{max-width:780px}
@media (max-width:1180px){.has-story h1,.has-story .lede,.has-story .kpis{max-width:600px}}
@media (max-width:960px){.story{position:relative;right:auto;top:auto;transform:none;width:230px;margin-top:32px}}

/* karluu numbers, infra, region */
.nums{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--ink);margin-bottom:28px}
.nums div{padding:22px 20px 0 0}
.nums strong{display:block;font:600 clamp(34px,4vw,52px)/1 var(--display);margin-bottom:10px;color:var(--dark)}
.nums span{color:var(--soft);font-size:15px;line-height:1.35;display:block}
@media (max-width:900px){.nums{grid-template-columns:1fr 1fr}.nums div:last-child{grid-column:1/-1}}
.infra figure{margin:0}
.infra img{width:100%;aspect-ratio:14/15;object-fit:cover;border-radius:var(--r)}
.infra figcaption{font:600 18px/1.3 var(--display);margin-top:12px}
@media (max-width:900px){.grid4.infra{grid-template-columns:1fr 1fr}}
.region{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;margin-top:22px}
.region .rnum{font:700 clamp(56px,7vw,92px)/1 var(--display);color:var(--accent);margin-bottom:14px}
.region .rows{padding:0}
@media (max-width:860px){.region{grid-template-columns:1fr;gap:16px}}
.tlist{margin:14px 0 0;padding-left:20px}
.tlist li{margin:6px 0;opacity:.95}
.terms + .disc{margin-top:14px}
.terms .btn-main{background:#fff;color:var(--dark)}

/* steps & faq */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);row-gap:36px;border-top:2px solid var(--ink);counter-reset:s}
.steps li{counter-increment:s;padding:24px 28px 0 0}
.steps li::before{content:counter(s);display:block;font:700 36px/1 var(--display);color:var(--accent);margin-bottom:12px}
body[data-theme="mariupol"] .steps li::before{color:var(--dark)}
.steps p{color:var(--soft);font-size:16px;margin-top:6px}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
details{border-bottom:1px solid var(--line);padding:20px 0}
summary{cursor:pointer;font:600 19px/1.4 var(--display);list-style:none;display:flex;justify-content:space-between;gap:24px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:26px;line-height:1;color:var(--accent)}
details[open] summary::after{content:"–"}
details p{margin-top:12px;color:var(--soft);max-width:760px}

/* lead */
.lead{background:var(--dark);color:#fff}
.lead-box{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.lead h2{margin-bottom:16px}
.lead p.l{font-size:19px;opacity:.9;max-width:480px}
.lead ul{margin:20px 0 0;padding-left:20px;opacity:.9}
.form{background:#fff;color:var(--ink);border-radius:var(--r);padding:30px;display:grid;gap:16px}
.form label>span{display:block;font-size:14px;color:var(--soft);margin-bottom:6px}
.form input[type=text],.form input[type=tel]{width:100%;font:400 16px var(--text);padding:14px 16px;border-radius:8px;border:1.5px solid var(--line)}
.consent{display:flex;gap:10px;font-size:13px;color:var(--soft)}
.form .err{display:none;color:#A12B1F;font-size:14px}
.form .done{display:none}
.form.sent .fields{display:none}
.form.sent .done{display:block}
.fields{display:grid;gap:16px}
.form .btn{background:var(--dark);color:#fff}
@media (max-width:860px){.lead-box{grid-template-columns:1fr}}

/* other objects */
.others{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.other{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.other:hover{border-color:var(--ink)}
.other .im{height:150px;background:var(--dark);overflow:hidden}
.other .im img,.other .im svg{width:100%;height:100%;object-fit:cover}
.other div.t{padding:18px 20px}
.other small{color:var(--soft)}
@media (max-width:860px){.others{grid-template-columns:1fr}}

footer{background:#151B19;color:#AEB8B4;font-size:14px;padding:48px 0 36px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:36px;margin-bottom:28px}
footer b{color:#fff}
footer a{color:#fff;text-decoration:none}
footer .legal{border-top:1px solid rgba(255,255,255,.12);padding-top:22px;line-height:1.6}
@media (max-width:860px){footer .cols{grid-template-columns:1fr}}
[hidden]{display:none!important}
</style>
</head>

function calcM(){
  const p=+document.getElementById("m-p").value, d=+document.getElementById("m-d").value, t=+document.getElementById("m-t").value;
  let down=p*d/100, loan=p-down, cap=false; if(loan>6){down+=loan-6;loan=6;cap=true;}
  const r=0.02/12,n=t*12,pay=loan*1e6*r/(1-Math.pow(1+r,-n));
  const y=t%10===1&&t%100!==11?"год":(t%10>=2&&t%10<=4&&(t%100<10||t%100>=20))?"года":"лет";
  document.getElementById("m-p-o").textContent=p.toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн ₽";
  document.getElementById("m-d-o").textContent=d+"%"; document.getElementById("m-t-o").textContent=t+" "+y;
  document.getElementById("m-pay").textContent=rub(pay);
  document.getElementById("m-loan").textContent=rub(loan*1e6); document.getElementById("m-down").textContent=rub(down*1e6);
  document.getElementById("m-warn").hidden=!cap;
}

function render(){
  const id=(location.hash.match(/^#\/(\w+)/)||[])[1];
  const key=O[id]?id:"karluu"; const o=O[key];
  if(document.body.dataset.obj===key) return;
  document.body.dataset.obj=key; document.body.dataset.theme=key;
  document.querySelectorAll(".proto a").forEach(a=>{ if(a.getAttribute("href")==="#/"+key) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const blocks = o.region==="n"
    ? [videoHTML,mortgageHTML,aboutHTML,finishHTML,layoutsHTML,cityHTML,locHTML]
    : [statsHTML,infraHTML,finishHTML,investHTML,manageHTML,growthHTML,termsHTML,locHTML,videoHTML];
  document.getElementById("top").innerHTML = heroHTML(o,key)+blocks.map(f=>f(o)).join("")+stepsHTML(o)+faqHTML(o)+leadHTML(o)+othersHTML(key);
  const nav=o.region==="n"?[["#invest","Ипотека 2%"],["#about","О доме"],["#layouts","Планировки"],["#city","Город"],["#loc","Расположение"]]:[["#stock","О комплексе"],["#invest","Доходность"],["#manage","Управление"],["#terms","Условия"],["#loc","Расположение"]];
  document.querySelectorAll(".snd").forEach(b=>b.addEventListener("click",()=>{const v=b.previousElementSibling; v.muted=!v.muted; if(!v.muted){v.currentTime=0;v.play();} b.textContent=v.muted?"Включить звук":"Выключить звук";}));
  document.getElementById("nav").innerHTML=nav.map(n=>`<a href="${n[0]}">${n[1]}</a>`).join("");
  document.getElementById("hdr-cta").textContent=o.region==="n"?"Узнать цену":"Получить расчёт";
  document.getElementById("ft-partner").innerHTML=`Партнёр застройщика ${o.dev}. Работаем по агентскому договору.`;
  const decl=document.getElementById("ft-decl"); decl.href=o.decl||"https://наш.дом.рф"; 
  document.getElementById("ft-legal").innerHTML=`ИП Чернова Елена Евгеньевна, ИНН 344221507488, ОГРНИП 324237500481614<br>Информация на сайте носит справочный характер и не является публичной офертой. Цены — по официальному прайсу застройщика. Доходность и рост стоимости — прогноз застройщика и управляющей компании, не гарантия. Материалы и визуализации предоставлены застройщиком. Проектные декларации размещены на наш.дом.рф.`;
  document.title=`${o.name} — ${o.eyebrow.toLowerCase()} | Вектор 360`;
  if(o.region==="n"){["m-p","m-d","m-t"].forEach(i=>document.getElementById(i).addEventListener("input",calcM));calcM();}
  document.querySelectorAll(".form").forEach(f=>f.addEventListener("submit",e=>{e.preventDefault();const ok=[...f.querySelectorAll("[required]")].every(i=>i.type==="checkbox"?i.checked:i.value.trim().length>1);f.querySelector(".err").style.display=ok?"none":"block";if(ok)f.classList.add("sent");}));
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",()=>{ if(location.hash.startsWith("#/")) render(); });
render();
</script>
